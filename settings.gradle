pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
}

rootProject.name = 'Datapack-Load-Error-Fix'

include('common')

include("forge")
project(":forge").with {
    projectDir = file("forge/")
    buildFileName = "root.gradle"
}

file('forge').listFiles((FileFilter) ((File file) -> 
    file.isDirectory() && file.name ==~ /(\d+)\.(\d+)(\.(\d+))?/
)).each {
    include("forge:$it.name")
    project(":forge:$it.name").with {
        projectDir = file("forge/${it.name}")
        buildFileName = '../build.gradle'
    }
}
