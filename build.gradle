plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.majong.datapackloaderrorfix'
version = '2.0.0'
description = 'Fix datapack loading errors caused by removed mods with custom dimensions'

ext {
    set 'mod_version', version.toString()
    set 'mod_id', 'datapackloaderrorfix'
    set 'mod_name', 'Datapack Load Error Fix'
    set 'mod_author', 'MajongMC'
    set 'mod_description', description.toString()
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(17)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

subprojects {
    version = rootProject.version
    
    if (project.parent?.name == 'forge') {
        archivesBaseName = "${rootProject.ext.mod_id}-forge-${project.name}"
    } else {
        archivesBaseName = "${rootProject.ext.mod_id}-${project.name}"
    }

    jar {
        from rootProject.file('LICENSE')
    }
}

println "Building ${rootProject.ext.mod_name} ${version} by ${rootProject.ext.mod_author}"